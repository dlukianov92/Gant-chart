<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Domain tests — Plan Rabot</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:720px;margin:24px auto;padding:0 16px}
    .pass{color:#0a0} .fail{color:#c00} h1{font-size:20px}
    pre{background:#f5f5f5;padding:12px;border-radius:8px;overflow:auto}
  </style>
</head>
<body>
  <h1>Domain tests</h1>
  <div id="out"></div>
  <script src="../js/domain-calc.js"></script>
  <script>
  (function(){
    var D = window.PlanDomain;
    var results = [];
    function assert(name, cond, detail){
      results.push({name:name, ok:!!cond, detail:detail||""});
    }
    // num
    assert("num 1,5", D.num("1,5") === 1.5);
    assert("num empty", D.num("") === null);
    assert("num bad", D.num("x") === null);
    // pkgDonePct
    assert("done 50%", Math.abs(D.pkgDonePct(100, 50) - 50) < 1e-9);
    assert("done clamp", D.pkgDonePct(10, 50) === 100);
    assert("done zero", D.pkgDonePct(0, 5) === 0);
    // budget
    assert("elemBudget", D.elemBudget([{price:10,total:3},{price:2,total:5}]) === 40);
    assert("objBudget", D.objBudget([{id:"a"},{id:"b"}], {a:[{price:1,total:2}], b:[{price:3,total:4}]}) === 14);
    // share
    assert("pkgShare", Math.abs(D.pkgShare(25, 100) - 0.25) < 1e-9);
    // migrate
    var m = D.migrateBoard({v:5, bars:[{}], types:[]}, 8);
    assert("migrate to 8", m && m.v === 8);
    assert("migrate fills", m.elemRes && m.detail && Array.isArray(m.bars));
    // validate
    assert("validate ok", D.validateImportPayload({bars:[{}]}) === null);
    assert("validate no bars", !!D.validateImportPayload({}));
    assert("validate too many", !!D.validateImportPayload({bars: new Array(5001)}));
    // labor shape
    var L = D.computeLaborTotals(
      [{start:0,end:14}],
      function(){ return {A: 80}; },
      40
    );
    assert("labor contrs", L.contrs.indexOf("A") >= 0);
    assert("labor weeks", Object.keys(L.weeks).length > 0);

    var ok = results.every(function(r){ return r.ok; });
    var html = results.map(function(r){
      return '<div class="'+(r.ok?"pass":"fail")+'">'+(r.ok?"✓":"✗")+" "+r.name+(r.detail?(" — "+r.detail):"")+"</div>";
    }).join("");
    html += "<p><b>"+(ok?"ALL PASSED":"FAILED")+"</b> ("+results.filter(function(r){return r.ok}).length+"/"+results.length+")</p>";
    document.getElementById("out").innerHTML = html;
    console.log(ok ? "ALL PASSED" : "FAILED", results);
  })();
  </script>
</body>
</html>
